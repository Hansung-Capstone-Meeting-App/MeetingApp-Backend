<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8"/>
    <style>
        @page {
            size: A4;
            margin: 16mm;
        }

        :root {
            --ink: #14263d;
            --muted: #738194;
            --line: #dbe4ee;
            --surface: #f6f8fb;
            --surface-strong: #e8eff7;
            --accent: #0f6cbd;
            --accent-soft: #dcecff;
        }

        * {
            box-sizing: border-box;
            font-family: 'MalgunGothic';
        }

        body {
            margin: 0;
            color: var(--ink);
            font-size: 10pt;
            line-height: 1.6;
        }

        .hero {
            background: linear-gradient(135deg, #1f354d 0%, #345776 48%, #5a85ab 100%);
            color: #fff;
            border-radius: 18px;
            padding: 22px 24px 20px;
        }

        .eyebrow {
            margin: 0 0 10px 0;
            font-size: 9pt;
            opacity: 0.82;
        }

        h1 {
            margin: 0;
            font-size: 20pt;
            line-height: 1.25;
            font-weight: 700;
        }

        .hero-meta {
            margin-top: 12px;
            font-size: 9pt;
            opacity: 0.9;
        }

        .hero-meta span + span::before {
            content: " · ";
        }

        .summary-bar {
            margin-top: 16px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 12px 16px;
        }

        .summary-bar span {
            display: inline-block;
            font-size: 9.3pt;
            color: var(--muted);
        }

        .summary-bar span + span {
            margin-left: 18px;
        }

        .section {
            margin-top: 18px;
            border: 1px solid var(--line);
            border-radius: 16px;
            background: #fff;
            padding: 18px;
        }

        .section-title {
            margin: 0 0 14px 0;
            font-size: 12pt;
            font-weight: 700;
        }

        .segment {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 12px 14px;
            margin-bottom: 10px;
            page-break-inside: avoid;
        }

        .segment:last-child {
            margin-bottom: 0;
        }

        .segment-head {
            margin: 0 0 8px 0;
        }

        .speaker {
            display: inline-block;
            padding: 3px 9px;
            border-radius: 999px;
            background: var(--accent-soft);
            color: var(--accent);
            font-size: 8.7pt;
            font-weight: 700;
        }

        .timestamp {
            margin-left: 8px;
            color: var(--muted);
            font-size: 8.8pt;
        }

        .content {
            margin: 0;
            white-space: pre-wrap;
            color: var(--ink);
        }

        .empty {
            margin: 0;
            color: var(--muted);
            background: var(--surface);
            border-radius: 12px;
            padding: 12px 14px;
        }

        .footer {
            margin-top: 18px;
            text-align: right;
            color: var(--muted);
            font-size: 8.5pt;
        }
    </style>
</head>
<body>
<div th:object="${transcript}">
    <div class="hero">
        <p class="eyebrow" th:if="*{workspaceName != null}" th:text="*{workspaceName}">워크스페이스</p>
        <p class="eyebrow" th:if="*{workspaceName == null}">MeetingApp Transcript</p>
        <h1 th:text="*{meetingTitle}">회의 제목</h1>
        <p class="hero-meta">
            <span th:text="'회의 생성 ' + *{meetingCreatedAt}">회의 생성</span>
            <span th:if="*{transcribedAt != null and transcribedAt != '-'}"
                  th:text="'전사 완료 ' + *{transcribedAt}">전사 완료</span>
        </p>
    </div>

    <div class="summary-bar" th:if="*{segments != null and !segments.isEmpty()}">
        <span th:text="'발화 수 ' + *{segments.size()} + '건'">발화 수</span>
        <span th:text="*{includeTimestamps} ? '타임스탬프 포함' : '타임스탬프 제외'">타임스탬프 포함</span>
    </div>

    <section class="section">
        <h2 class="section-title">대화록</h2>
        <div th:if="*{segments != null and !segments.isEmpty()}">
            <div class="segment" th:each="seg : *{segments}">
                <p class="segment-head">
                    <span class="speaker" th:text="${seg.speakerName}">화자</span>
                    <span class="timestamp"
                          th:if="${seg.timestamp != null and !seg.timestamp.isEmpty()}"
                          th:text="${seg.timestamp}">00:02 ~ 00:07</span>
                </p>
                <p class="content" th:text="${seg.content}">발화 내용</p>
            </div>
        </div>
        <p class="empty" th:if="*{segments == null or segments.isEmpty()}">전사된 대화 내용이 없습니다.</p>
    </section>

    <p class="footer" th:text="'MeetingApp · 생성 시각 ' + *{exportedAt}">푸터</p>
</div>
</body>
</html>
